<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140f0a" />
    <title>Keep Lit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=EB+Garamond:ital,wght@1,500;1,600&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600,0..30,0;0,9..144,700,0..30,0;1,9..144,600,0..30,0;1,9..144,700,0..30,0&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-status") || document.getElementById("boot-error");
          if (!el) return;
          el.id = "boot-error";
          el.textContent = msg;
        }
        window.addEventListener("error", function (event) {
          show((event && event.message) || "The game failed to start.");
        });
        window.addEventListener("unhandledrejection", function (event) {
          show(String((event && event.reason) || "The game failed to start."));
        });
      })();
    </script>
  </head>
  <body>
    <div id="game">
      <div id="boot-status">Loading Keep Lit…</div>
      <div id="stage">
        <canvas id="view" width="1280" height="800"></canvas>
        <div id="hud" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
